# /etc/kagami/kagami.toml
# Generated by `kagami init`

[agent]
# User-chosen name for this machine's tunnel.
# Maps to a Durable Object instance via idFromName(tunnel_id).
# Set during `kagami init`.
tunnel_id = "my-homelab"

# Per-machine secret for agent authentication.
# Generated by the Worker during registration and stored locally.
# Set during `kagami init`.
secret = "kgm_mach_aBcDeFgHiJkLmNoPqRsTuVwXyZ123456"

# Worker base URL to connect to.
# Set during `kagami init`.
server = "kagami.myworkers.dev"

# Interval between keepalive pings sent to the Durable Object.
# ping_interval = "30s"

# Base delay before reconnecting after a disconnect.
# reconnect_interval = "5s"

# Maximum backoff delay for reconnection attempts.
# max_reconnect_interval = "60s"

# Timeout for forwarding requests to local services.
# Should be less than the DO-side 30s timeout.
# proxy_timeout = "25s"

[[tunnel]]
name = "api"
local_addr = "localhost:8080"
hostname = "api.my-homelab.kagami.myworkers.dev"

[[tunnel]]
name = "admin"
local_addr = "localhost:3000"
hostname = "admin.my-homelab.kagami.myworkers.dev"
# path_prefix = "/admin"
# protocol = "https"
